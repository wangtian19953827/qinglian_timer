name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.qinglian --project-name qinglian_timer .

      - name: Apply custom Info.plist
        run: cp .github/ios/Info.plist ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r qinglian_timer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: qinglian_timer-ipa
          path: build/ios/iphoneos/qinglian_timer.ipa
          if-no-files-found: error